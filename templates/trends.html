{% extends "base.html" %}
{% set active_page = 'trends' %}
{% block title %}趋势 - Baby Tracker{% endblock %}

{% block content %}
<div class="space-y-5 fade-in pb-20 md:pb-0">
    <div class="flex items-center gap-3 flex-wrap">
        <h1 class="text-xl font-semibold">趋势</h1>
        <div class="flex-1"></div>
        <!-- 模式选择器：日/月/时 -->
        <div class="card flex items-center gap-0.5 p-0.5">
            <button class="tab-pill px-3 py-1 text-xs rounded-md active" data-mode="day" onclick="switchTrendMode('day')">日</button>
            <button class="tab-pill px-3 py-1 text-xs rounded-md" data-mode="month" onclick="switchTrendMode('month')">月</button>
            <button class="tab-pill px-3 py-1 text-xs rounded-md" data-mode="hour" onclick="switchTrendMode('hour')">时</button>
        </div>
        <!-- 范围选择器（固定位置大小，内容随模式切换） -->
        <!-- 时模式日期选择器：放在外部，用 label for 触发（iOS兼容） -->
        <input type="date" id="trend-date" class="sr-only" onchange="onRangeChange(this.value)">
        <div class="range-pill relative" id="range-picker-wrap">
            <span class="range-display" id="range-display">14天</span>
            <!-- 日/月模式：天数 select -->
            <select id="trend-days" onchange="onRangeChange(this.value)">
                <option value="7">7天</option>
                <option value="14" selected>14天</option>
                <option value="30">30天</option>
                <option value="60">60天</option>
                <option value="90">90天</option>
            </select>
            <!-- 时模式：label 覆盖整个 pill 触发外部 date input -->
            <label for="trend-date" id="trend-date-label" class="absolute inset-0 cursor-pointer hidden"></label>
        </div>
    </div>

    <!-- 体重趋势 -->
    <div class="card">
        <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-2">
                <i data-lucide="scale" class="w-4 h-4 text-accent"></i>
                <h2 class="text-sm font-medium text-text-secondary">体重趋势</h2>
            </div>
            <div class="flex items-center gap-2">
                <label class="range-pill relative" id="weight-days-wrap">
                    <span class="range-display" id="weight-days-display">30天</span>
                    <select id="weight-days" onchange="loadWeightTrend()">
                        <option value="30" selected>30天</option>
                        <option value="90">90天</option>
                        <option value="180">半年</option>
                        <option value="365">1年</option>
                    </select>
                </label>
                <button class="text-xs px-2 py-1 rounded border border-accent/30 text-accent hover:bg-accent/10 transition-colors inline-flex items-center" onclick="showWeightModal()" style="height:28px">记录体重</button>
            </div>
        </div>
        <div style="position:relative;height:200px">
            <canvas id="weight-chart"></canvas>
        </div>
        <div id="weight-list" class="mt-3 space-y-1"></div>
    </div>

    <!-- 喂养量趋势 -->
    <div class="card">
        <div class="flex items-center gap-2 mb-3">
            <i data-lucide="bar-chart-3" class="w-4 h-4 text-accent"></i>
            <h2 class="text-sm font-medium text-text-secondary" id="feed-chart-title">每日喂养量</h2>
            <span class="text-[10px] text-text-muted">(ml)</span>
        </div>
        <div style="position:relative;height:200px">
            <canvas id="feed-chart"></canvas>
        </div>
    </div>

    <!-- 辅食趋势 -->
    <div class="card" id="food-card">
        <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-2">
                <i data-lucide="utensils" class="w-4 h-4 text-accent"></i>
                <h2 class="text-sm font-medium text-text-secondary" id="food-chart-title">每日辅食</h2>
                <span class="text-[10px] text-text-muted" id="food-unit-hint"></span>
            </div>
            <div id="food-legend" class="flex items-center gap-3 text-xs"></div>
        </div>
        <div style="position:relative;height:200px">
            <canvas id="food-chart"></canvas>
        </div>
        <div id="food-empty" class="hidden text-center text-xs text-text-muted py-6">暂无辅食记录</div>
    </div>

    <!-- 排泄趋势 -->
    <div class="card">
        <div class="flex items-center gap-2 mb-3">
            <i data-lucide="activity" class="w-4 h-4 text-accent"></i>
            <h2 class="text-sm font-medium text-text-secondary" id="excrete-chart-title">每日排泄</h2>
            <span class="text-[10px] text-text-muted">(次)</span>
        </div>
        <div style="position:relative;height:160px">
            <canvas id="excrete-chart"></canvas>
        </div>
        <div class="flex items-center gap-4 mt-2 text-xs">
            <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-amber-400 inline-block"></span>排尿</span>
            <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-red-400 inline-block"></span>排便</span>
        </div>
    </div>

    <!-- 喂养时段分布（仅日模式显示） -->
    <div class="card" id="hour-card">
        <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-2">
                <i data-lucide="clock" class="w-4 h-4 text-accent"></i>
                <h2 class="text-sm font-medium text-text-secondary">喂养时段分布</h2>
                <span class="text-[10px] text-text-muted">(次)</span>
            </div>
            <div class="flex items-center gap-2">
                <input type="date" id="hour-chart-day" class="sr-only" onchange="onHourDayChange(this.value)">
                <label class="range-pill relative" for="hour-chart-day" id="hour-day-wrap">
                    <span class="range-display" id="hour-day-display">今日</span>
                </label>
                <button class="text-xs px-2 py-1 rounded border border-accent/30 text-accent hover:bg-accent/10 transition-colors inline-flex items-center" onclick="clearHourDay()" style="height:28px">全部</button>
            </div>
        </div>
        <div style="position:relative;height:160px">
            <canvas id="hour-chart"></canvas>
        </div>
    </div>
</div>

<!-- 体重记录弹窗 -->
<div id="weight-modal" class="fixed inset-0 z-[90] hidden items-center justify-center bg-black/60">
    <div class="bg-surface border border-border rounded-xl p-6 w-80 max-w-[90vw]">
        <h3 id="weight-modal-title" class="text-sm font-medium text-text-secondary mb-3">记录体重</h3>
        <div class="space-y-3">
            <div>
                <label class="text-text-muted text-xs mb-1 block">体重 (kg)</label>
                <input type="number" id="weight-value" class="input-field font-mono" step="0.01" min="0.5" max="20" placeholder="3.50">
            </div>
            <div>
                <label class="text-text-muted text-xs mb-1 block">日期</label>
                <input type="date" id="weight-date" class="input-field font-mono">
            </div>
            <div>
                <label class="text-text-muted text-xs mb-1 block">备注</label>
                <input type="text" id="weight-note" class="input-field" placeholder="可选">
            </div>
        </div>
        <div class="flex gap-2 mt-4">
            <button class="btn-secondary flex-1 text-sm" onclick="closeWeightModal()">取消</button>
            <button class="btn-primary flex-1 text-sm" onclick="saveWeight()">保存</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7" data-page-script="chart.js"></script>
<script src="/static/js/trends.js" data-page-script></script>
{% endblock %}
